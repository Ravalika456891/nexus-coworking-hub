                          <Icon name="database" className="w-6 h-6" />
                        </div>
                        <div>
                          <div className="flex items-center gap-2.5">
                            <h2 className="text-2xl font-black text-[#111827]">Database Tables &amp; Collections</h2>
                            <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-50 text-emerald-600 border border-emerald-200">
                              <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                              MongoDB Atlas Connected
                            </span>
                          </div>
                          <p className="text-xs text-[#8A90A2] mt-1">
                            Live multi-tenant collections, index schemas, and records for NEXUS HUB Incubation OS
                          </p>
                        </div>
                      </div>

                      <div className="flex items-center gap-2.5 self-start md:self-auto">
                        <button
                          onClick={() => showToast("Database cache flushed. Fetched latest MongoDB Atlas records.")}
                          className="px-3.5 py-2 bg-[#F6F7FB] border border-[#ECEEF4] hover:bg-[#EEEBFF] hover:text-[#4F3FE0] text-[#374151] text-xs font-semibold rounded-xl transition-all flex items-center gap-1.5"
                        >
                          <Icon name="repeat" className="w-3.5 h-3.5" />
                          <span>Sync Data</span>
                        </button>
                        <a
                          href="app.html"
                          target="_blank"
                          rel="noreferrer"
                          className="px-4 py-2 bg-[#111827] hover:bg-black text-white text-xs font-bold rounded-xl transition-all shadow-sm flex items-center gap-1.5"
                        >
                          <span>Full Admin Shell</span>
                          <Icon name="externalLink" className="w-3.5 h-3.5" />
                        </a>
                      </div>
                    </div>

                    {/* Quick Metric Badges */}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-5 pt-5 border-t border-[#ECEEF4]">
                      <div className="p-3 bg-[#F8F9FD] rounded-xl border border-[#ECEEF4]">
                        <div className="text-[11px] font-semibold text-[#8A90A2]">Active Cluster</div>
                        <div className="text-sm font-extrabold text-[#111827] mt-0.5">cluster0.nexus.net</div>
                      </div>
                      <div className="p-3 bg-[#F8F9FD] rounded-xl border border-[#ECEEF4]">
                        <div className="text-[11px] font-semibold text-[#8A90A2]">Collections</div>
                        <div className="text-sm font-extrabold text-[#4F3FE0] mt-0.5">{Object.keys(DB_COLLECTIONS).length} Collections</div>
                      </div>
                      <div className="p-3 bg-[#F8F9FD] rounded-xl border border-[#ECEEF4]">
                        <div className="text-[11px] font-semibold text-[#8A90A2]">Selected Records</div>
                        <div className="text-sm font-extrabold text-[#111827] mt-0.5">{(DB_COLLECTIONS[dbCollection] || []).length} Documents</div>
                      </div>
                      <div className="p-3 bg-[#F8F9FD] rounded-xl border border-[#ECEEF4]">
                        <div className="text-[11px] font-semibold text-[#8A90A2]">Database Latency</div>
                        <div className="text-sm font-extrabold text-emerald-600 mt-0.5">38ms Ping (Optimal)</div>
                      </div>
                    </div>
                  </div>

                  {/* Collections Selector & Filter */}
                  <div className="bg-white border border-[#ECEEF4] rounded-2xl p-5 shadow-soft space-y-4">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      {/* Collection Tabs */}
                      <div className="flex items-center gap-2 overflow-x-auto pb-1 sm:pb-0 scrollbar-none">
                        {Object.keys(DB_COLLECTIONS).map(colName => {
                          const isActive = dbCollection === colName;
                          const count = DB_COLLECTIONS[colName].length;
                          return (
                            <button
                              key={colName}
                              onClick={() => {
                                setDbCollection(colName);
                                setDbSearch("");
                              }}
                              className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 whitespace-nowrap ${
                                isActive
                                  ? "bg-[#4F3FE0] text-white shadow-sm"
                                  : "bg-[#F6F7FB] text-[#374151] hover:bg-[#EEEBFF] hover:text-[#4F3FE0]"
                              }`}
                            >
                              <span>{colName}</span>
                              <span className={`px-1.5 py-0.5 rounded-full text-[10px] font-extrabold ${
                                isActive ? "bg-white/20 text-white" : "bg-white text-[#8A90A2] border border-[#ECEEF4]"
                              }`}>
                                {count}
                              </span>
                            </button>
                          );
                        })}
                      </div>

                      {/* Search in active collection */}
                      <div className="relative w-full sm:w-64 flex-shrink-0">
                        <Icon name="search" className="w-4 h-4 text-[#8A90A2] absolute left-3 top-1/2 -translate-y-1/2" />
                        <input
                          type="text"
                          value={dbSearch}
                          onChange={(e) => setDbSearch(e.target.value)}
                          placeholder={`Search ${dbCollection}...`}
                          className="w-full pl-9 pr-3 py-2 bg-[#F6F7FB] border border-[#ECEEF4] rounded-xl text-xs font-medium text-[#111827] focus:outline-none focus:border-[#4F3FE0] focus:bg-white"
                        />
                      </div>
                    </div>

                    {/* Records Table */}
                    <div className="overflow-x-auto border border-[#ECEEF4] rounded-xl">
                      <table className="w-full text-left border-collapse text-xs">
                        <thead>
                          <tr className="bg-[#F8F9FD] border-b border-[#ECEEF4] text-[#8A90A2] font-bold uppercase tracking-wider text-[11px]">
                            <th className="py-3 px-4">_id</th>
                            <th className="py-3 px-4">Identifier / Title</th>
                            <th className="py-3 px-4">Attributes</th>
                            <th className="py-3 px-4">Status / State</th>
                            <th className="py-3 px-4 text-right">Actions</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-[#ECEEF4]">
                          {(() => {
                            const rawList = DB_COLLECTIONS[dbCollection] || [];
                            const filtered = rawList.filter(item => {
                              if (!dbSearch) return true;
                              const query = dbSearch.toLowerCase();
                              return Object.values(item).some(val => 
                                String(val).toLowerCase().includes(query)
                              );
                            });

                            if (filtered.length === 0) {
                              return (
                                <tr>
                                  <td colSpan={5} className="py-8 text-center text-xs text-[#8A90A2]">
                                    No records matched your search in collection <strong>{dbCollection}</strong>
                                  </td>
                                </tr>
                              );
                            }

                            return filtered.map((row, idx) => {
                              const displayName = row.name || row.label || row.roomName || row.invoiceNumber || row.fullName || "Record #" + (idx + 1);
                              const subInfo = row.founder || row.type || row.bookedBy || row.recipient || row.company || "";
                              const status = row.status || "Active";
                              const statusClasses = 
                                status === "Active" || status === "Available" || status === "Confirmed" || status === "Paid"
                                  ? "bg-emerald-50 text-emerald-600 border border-emerald-200"
                                  : status === "In Use" || status === "In Progress"
                                  ? "bg-amber-50 text-amber-600 border border-amber-200"
                                  : "bg-indigo-50 text-[#4F3FE0] border border-indigo-200";

                              return (
                                <tr key={row._id || idx} className="hover:bg-[#F9FAFC] transition-colors">
                                  <td className="py-3 px-4 font-mono text-[11px] text-[#4F3FE0] font-semibold whitespace-nowrap">
                                    {row._id}
                                  </td>
                                  <td className="py-3 px-4">
                                    <div className="font-bold text-[#111827]">{displayName}</div>
                                    {subInfo && <div className="text-[11px] text-[#8A90A2] mt-0.5">{subInfo}</div>}
                                  </td>
                                  <td className="py-3 px-4 text-[#374151]">
                                    <div className="flex flex-wrap gap-1.5 max-w-xs">
                                      {row.capacity && <span className="bg-gray-100 text-gray-600 px-2 py-0.5 rounded text-[10px] font-medium">Cap: {row.capacity}</span>}
                                      {row.creditsRemaining !== undefined && <span className="bg-purple-50 text-[#4F3FE0] px-2 py-0.5 rounded text-[10px] font-bold">{row.creditsRemaining} cr</span>}
                                      {row.creditsPerHour && <span className="bg-purple-50 text-[#4F3FE0] px-2 py-0.5 rounded text-[10px] font-bold">{row.creditsPerHour} cr/hr</span>}
                                      {row.amount && <span className="bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded text-[10px] font-bold">{row.amount}</span>}
                                      {row.tier && <span className="bg-blue-50 text-blue-700 px-2 py-0.5 rounded text-[10px] font-medium">{row.tier}</span>}
                                      {row.slot && <span className="bg-amber-50 text-amber-700 px-2 py-0.5 rounded text-[10px] font-medium">{row.slot}</span>}
                                    </div>
                                  </td>
                                  <td className="py-3 px-4 whitespace-nowrap">
                                    <span className={`px-2.5 py-1 rounded-full text-[11px] font-bold ${statusClasses}`}>
                                      {status}
                                    </span>
                                  </td>
                                  <td className="py-3 px-4 text-right whitespace-nowrap">
                                    <button
                                      onClick={() => setSelectedDbDoc(row)}
                                      className="px-3 py-1.5 bg-[#EEEBFF] hover:bg-[#4F3FE0] text-[#4F3FE0] hover:text-white rounded-lg font-bold text-[11px] transition-all"
                                    >
                                      Inspect JSON
                                    </button>
                                  </td>
                                </tr>
                              );
                            });
                          })()}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* JSON Inspector Modal */}
              {selectedDbDoc && (
                <div
                  className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs animate-fadeIn"
                  onClick={() => setSelectedDbDoc(null)}
                >
                  <div
                    className="bg-[#111827] text-white rounded-2xl w-full max-w-xl shadow-2xl border border-gray-700 p-6 space-y-4"
                    onClick={(e) => e.stopPropagation()}
                  >
                    <div className="flex items-center justify-between pb-3 border-b border-gray-800">
                      <div className="flex items-center gap-2">
                        <Icon name="database" className="w-5 h-5 text-[#4F3FE0]" />
                        <h3 className="font-extrabold text-sm text-white">Document Inspector ({selectedDbDoc._id})</h3>
                      </div>
                      <button
                        onClick={() => setSelectedDbDoc(null)}
                        className="w-7 h-7 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-white flex items-center justify-center text-xs font-bold"
                      >
                        ✕
                      </button>
                    </div>

                    <pre className="bg-[#0B0F19] p-4 rounded-xl text-xs font-mono text-emerald-400 overflow-x-auto max-h-96 border border-gray-800 leading-relaxed">
                      {JSON.stringify(selectedDbDoc, null, 2)}
                    </pre>

                    <div className="flex items-center justify-between pt-2">
                      <span className="text-[11px] text-gray-400">Read-only sandbox replica</span>
                      <div className="flex gap-2">
                        <button
                          onClick={() => {
                            navigator.clipboard?.writeText(JSON.stringify(selectedDbDoc, null, 2));
                            showToast("Copied JSON payload to clipboard!");
                          }}
                          className="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-white text-xs font-semibold rounded-lg transition-all"
                        >
                          Copy JSON
                        </button>
                        <button
                          onClick={() => setSelectedDbDoc(null)}
                          className="px-4 py-1.5 bg-[#4F3FE0] hover:bg-[#4335C9] text-white text-xs font-bold rounded-lg transition-all"
                        >
                          Close
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* ── VIEW 11: SETTINGS ── */}
              {activeNav === "Settings" && (
                <div className="space-y-6 animate-fadeIn">
                  <div className="bg-white border border-[#ECEEF4] rounded-2xl p-6 shadow-soft">
                    <h2 className="text-2xl font-black text-[#111827]">Preferences &amp; Integrations</h2>
                    <p className="text-xs text-[#8A90A2] mt-1">Calendar synchronization, notifications and security</p>
                  </div>

                  <div className="bg-white border border-[#ECEEF4] rounded-2xl p-6 shadow-soft space-y-4">
                    <div className="flex items-center justify-between pb-4 border-b border-[#ECEEF4]">
                      <div>
                        <div className="font-bold text-sm text-[#111827]">Google Calendar Sync</div>
                        <div className="text-xs text-[#8A90A2]">Automatically push confirmed room reservations to your company GSuite</div>
                      </div>
                      <span className="bg-emerald-50 text-emerald-600 font-bold px-3 py-1 rounded-full text-xs">Connected</span>
                    </div>

                    <div className="flex items-center justify-between pb-4 border-b border-[#ECEEF4]">
                      <div>
                        <div className="font-bold text-sm text-[#111827]">WhatsApp Booking Alerts</div>
                        <div className="text-xs text-[#8A90A2]">Receive 15-minute room start reminders and access passcodes</div>
                      </div>
                      <span className="bg-emerald-50 text-emerald-600 font-bold px-3 py-1 rounded-full text-xs">Active (+91 9880012345)</span>
                    </div>

                    <div className="pt-2 flex items-center justify-between">
                      <div>
                        <div className="font-bold text-sm text-[#111827]">Full Operating System Command Center</div>
                        <div className="text-xs text-[#8A90A2]">Access complete multi-tenant database tables, invoicing &amp; admin controls</div>
                      </div>
                      <a
                        href="app.html"
                        className="bg-[#111827] text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-black transition-all flex items-center gap-1.5"
                      >
                        <span>Launch Terminal</span>
                        <Icon name="externalLink" className="w-3.5 h-3.5" />
                      </a>
                    </div>
                  </div>
                </div>
              )}

            </div>

          </div>


          {/* =========================================================================
              MODAL: CONFIRM RESERVATION
              ========================================================================= */}
          {bookingModalRoom && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-fadeIn">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-[#ECEEF4] relative animate-scaleUp">
                <div className="flex items-center justify-between pb-3 border-b border-[#ECEEF4]">
                  <div>
                    <h3 className="text-lg font-black text-[#111827]">Book {bookingModalRoom.name}</h3>
                    <p className="text-xs text-[#8A90A2]">Instant confirmation • Deducts 1 hour credit</p>
                  </div>
                  <button
                    onClick={() => setBookingModalRoom(null)}
                    className="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-500"
                  >
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <form onSubmit={handleConfirmBooking} className="mt-4 space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-[#374151] mb-1">Meeting Title</label>
                    <input
                      type="text"
                      required
                      value={meetingTitleInput}
                      onChange={(e) => setMeetingTitleInput(e.target.value)}
                      placeholder="e.g. Q4 Executive Pitch Session"
                      className="w-full bg-[#F6F7FB] border border-[#ECEEF4] rounded-xl px-3.5 py-2 text-sm text-[#111827] focus:outline-none focus:border-[#4F3FE0] focus:bg-white"
                    />
                  </div>

                  <div className="bg-[#F8F9FD] border border-[#E3DEFF] rounded-xl p-3.5 space-y-2 text-xs">
                    <div className="flex justify-between">
                      <span className="text-[#8A90A2]">Room Rate:</span>
                      <span className="font-bold text-[#111827]">{bookingModalRoom.rate} (Covered by Credits)</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-[#8A90A2]">Date &amp; Time:</span>
                      <span className="font-bold text-[#111827]">{selectedDate} • {selectedTime}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-[#8A90A2]">Attendees:</span>
                      <span className="font-bold text-[#111827]">{selectedPeople} people (Capacity: {bookingModalRoom.capacity})</span>
                    </div>
                  </div>

                  <div className="flex items-center justify-end gap-2.5 pt-2">
                    <button
                      type="button"
                      onClick={() => setBookingModalRoom(null)}
                      className="px-4 py-2 border border-[#ECEEF4] text-[#374151] rounded-xl text-xs font-bold hover:bg-gray-50"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-[#4F3FE0] hover:bg-[#4335C9] text-white rounded-xl text-xs font-bold shadow-sm"
                    >
                      Confirm Reservation
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}


          {/* ── Toast Notification ── */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 bg-[#111827] text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-lg border border-gray-700 z-50 flex items-center gap-2 animate-bounce">
              <span>⚡</span>
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<MeetingRoomsApp />, document.getElementById('root'));
  </script>
</body>
</html>
