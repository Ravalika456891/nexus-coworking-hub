<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Hub — Meeting Rooms &amp; Conference Suites</title>

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {


          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            nexus: {
              primary: '#4F3FE0',
              'primary-hover': '#4335C9',
              bg: '#F6F7FB',
              card: '#FFFFFF',
              border: '#ECEEF4',
              heading: '#111827',
              body: '#374151',
              muted: '#8A90A2',
              lavender: '#F4F2FF',
              'lavender-light': '#F8F7FF',
              'lavender-border': '#E4DEFF'
            }
          },
          boxShadow: {
            soft: '0 2px 14px rgba(17, 24, 39, 0.04)',
            card: '0 4px 20px rgba(79, 63, 224, 0.06)'
          }
        }
      }
    }
  </script>

  <!-- React 18 Fast CDN with Fallback -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script>
    if (!window.React) {
      document.write('<script src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>');

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F6F7FB;

      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #F1F3F9;
    }

    ::-webkit-scrollbar-thumb {
      background: #D1D5E0;
      border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #A0A6B8;
    }
  </style>

<body class="bg-[#F6F7FB] min-h-screen">
  <div id="root">

          style="width: 38px; height: 38px; border: 3px solid #E2E8F0; border-top-color: #4F3FE0; border-radius: 50%; animation: nx-spin 0.8s linear infinite;">

      </div>
    </div>
    <style>
      @keyframes nx-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </div>

  <script src="js/meeting-rooms-bundle.js?v=20261103_02"></script>
